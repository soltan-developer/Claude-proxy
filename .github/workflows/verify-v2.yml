name: Verify v2 contracts

on:
  pull_request:
    paths:
      - 'src-tauri/src/v2/**'
      - 'src-tauri/src/lib.rs'
      - 'src-tauri/src/bridge_v2.rs'
      - 'src-tauri/src/observability.rs'
      - 'scripts/verify-local-code.ps1'
      - 'src/UsagePage.tsx'
      - 'src/types.ts'
      - 'src/**'
      - 'package.json'
      - 'README.md'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/build-portable.ps1'
      - 'scripts/check-version.mjs'
      - 'scripts/bump-version.mjs'
      - '.github/workflows/build-portable.yml'
      - 'package-lock.json'
      - '.github/workflows/verify-v2.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  v2-contracts:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Validate local Code smoke script in dry-run (no credentials or provider calls)
        shell: pwsh
        run: ./scripts/verify-local-code.ps1
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Run all Rust tests, including v2 contracts
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  v2-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify synchronized version and required PR bump
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-version.mjs --base "$BASE_SHA"
      - name: Install frontend dependencies
        # The repository currently has no package-lock.json; add one before
        # switching this job to a fully reproducible npm ci install.
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Typecheck and build frontend
        run: npm run build
