name: Build portable Windows app

on:
  push:
    branches:
      - main
      - v2/automatic-provider-network-recovery
      - v2/2.0.9-direct-provider-fidelity
      - v2/2.0.9-connection-architecture-ui-recovery
      - v2/2.0.9-qwen-thinking-fidelity
      - v2/2.0.9-greeting-tool-routing-audit
      - v2/2.0.9-cowork-bootstrap-fidelity
      - v2/2.0.9-cowork-user-text-order-integrity
      - v2/2.0.10-versioned-portable-release
      - v2/2.0.11-cowork-native-message-roles
      - v2/2.0.12-real-web-capability-diagnostics
      - v2/2.0.9-tool-fidelity-regressions
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-portable:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify and expose application version
        shell: pwsh
        run: |
          node scripts/check-version.mjs
          $version = node -p "require('./package.json').version"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate Portable PowerShell syntax
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "scripts/build-portable.ps1").Path, [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw "Portable build script has PowerShell syntax errors." }

      - name: Build portable executable
        shell: pwsh
        run: pnpm build:portable

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Proxy-v${{ env.APP_VERSION }}-Portable
          path: portable/Claude-Proxy-v${{ env.APP_VERSION }}-Portable.exe
          if-no-files-found: error
          retention-days: 14
